name: Probe Eurostat

# Diagnostic, not part of the nightly. The dev sandbox can't reach
# ec.europa.eu, but an Actions runner can — so this runs the probe from a
# machine that sees the API the same way fetch-activity.mjs does at 03:17.
#
# Runs on push to a claude/** branch (so it can be exercised without
# touching main) and on manual dispatch. Read-only: no commits, no issues,
# no secrets. Delete once the Eurostat query is fixed.

on:
  push:
    branches: ["claude/**"]
    paths:
      - "portfolio/glidepath/scripts/probe-eurostat.mjs"
      - ".github/workflows/probe-eurostat.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Probe Eurostat
        working-directory: portfolio/glidepath
        run: node scripts/probe-eurostat.mjs
